<div id="mode-cash">
  <div id="cash-main-view">
    <div class="panel no-print hidden" id="cash-add-box">
      <div class="rep-grid grid-flush">
        <button class="btn-primary btn-compact" onclick="openCashModal()">
          ➕ Сбор с боксов
        </button>
        <button class="btn-outline btn-compact" onclick="openExpModal()">
          🧾 Расход / Терминал
        </button>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <h3 class="panel-title">Сводка и расчет</h3>
        <div class="toolbar-inline">
          <select
            id="cash-period"
            class="mini-select no-print"
            onchange="renderCashStats()"
          >
            <option value="pending" selected>К отправке (Ожидает)</option>
            <option value="today">Архив: Сегодня</option>
            <option value="week">Архив: Неделя</option>
            <option value="month">Архив: Месяц</option>
            <option value="all">Архив: Всё время</option>
          </select>
          <button class="btn-print btn-icon no-print" onclick="window.print()">
            🖨️
          </button>
        </div>
      </div>
      <div id="cash-boxes-summary"></div>
    </div>

    <div class="panel">
      <h3 id="cash-base-title">Движение по кассе (база 4500 грн)</h3>
      <div id="cash-flow-summary"></div>
    </div>

    <div class="panel no-print">
      <div class="stack-col">
        <button
          class="btn-outline btn-full"
          onclick="toggleCashSub('dispatches')"
        >
          📤 История отправок (с детализацией)
        </button>
        <button class="btn-outline btn-full" onclick="toggleCashSub('matrix')">
          📊 Таблица сборов (1–5, Пыл)
        </button>
      </div>
    </div>
  </div>

  <!-- СПИСОК ВСЕХ ОТПРАВОК -->
  <div id="cash-dispatches-view" class="hidden">
    <div class="rep-toolbar no-print">
      <button class="btn-back" onclick="toggleCashSub('main')">← Назад</button>
      <button class="btn-print" onclick="window.print()">🖨️ Печать</button>
    </div>
    <div class="panel print-area">
      <h3>История отправок</h3>
      <div class="panel-hint">
        Нажмите на отправку, чтобы увидеть полный расклад по боксам и
        компенсациям
      </div>
      <div id="dispatches-list-box"></div>
    </div>
  </div>

  <!-- ДЕТАЛИЗАЦИЯ КОНКРЕТНОЙ ОТПРАВКИ -->
  <div id="cash-dispatch-detail-view" class="hidden">
    <div class="rep-toolbar no-print">
      <button class="btn-back" onclick="toggleCashSub('dispatches')">
        ← К списку отправок
      </button>
      <button class="btn-print" onclick="window.print()">🖨️ Печать</button>
    </div>
    <div class="panel print-area">
      <h3 id="disp-detail-title">Отправка</h3>
      <div id="disp-detail-box"></div>
    </div>
  </div>

  <!-- КОМПАКТНАЯ ТАБЛИЦА СБОРОВ -->
  <div id="cash-matrix-view" class="hidden">
    <div class="rep-toolbar no-print">
      <button class="btn-back" onclick="toggleCashSub('main')">← Назад</button>
      <button class="btn-print" onclick="window.print()">🖨️ Печать</button>
    </div>
    <div class="panel print-area">
      <h3>Сводка сборов по боксам</h3>
      <div id="matrix-table-box"></div>
    </div>
  </div>

  <!-- СВОДКА ЗА КОНКРЕТНУЮ ДАТУ -->
  <div id="cash-tx-view" class="hidden">
    <div class="rep-toolbar no-print">
      <button class="btn-back" onclick="toggleCashSub('matrix')">
        ← К таблице
      </button>
      <button class="btn-print" onclick="window.print()">🖨️ Печать</button>
    </div>
    <div class="panel print-area">
      <div class="panel-head panel-head-lg">
        <h3 class="panel-title">Сводка за дату</h3>
        <select
          id="tx-date-select"
          class="mini-select"
          onchange="renderDateReport()"
        ></select>
      </div>
      <div id="date-report-box"></div>
    </div>
  </div>
</div>
