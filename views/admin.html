<div id="tab-logs" class="tab-view hidden">
  <div class="panel">
    <h3>История изменений</h3>
    <div id="logs-list"></div>
  </div>
</div>

<div id="tab-perms" class="tab-view hidden">
  <div class="panel">
    <h3>Настройки кассы и графика</h3>
    <div class="field-label">Норматив операционной кассы (база), грн</div>
    <div class="inline-row">
      <input
        type="number"
        id="set-cash-base"
        class="field field-inline"
        placeholder="4500"
      />
      <button class="btn-primary btn-inline" onclick="saveSettings()">
        Сохранить
      </button>
    </div>
    <button class="btn-outline btn-full" onclick="openTemplateModal()">
      📅 Шаблон расписания смен (Пн–Вс)
    </button>
  </div>

  <div class="panel">
    <h3>Настройка прав ролей</h3>
    <div id="perms-box"></div>
    <button class="btn-primary btn-blue btn-mt" onclick="savePerms()">
      Сохранить права
    </button>
  </div>
</div>
