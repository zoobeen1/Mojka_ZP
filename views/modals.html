<div id="cash-modal" class="modal-overlay hidden no-print">
  <div class="modal-window">
    <div class="modal-head">
      <div>
        <div class="modal-title">Сбор выручки с боксов</div>
        <input type="date" id="cash-date" class="mini-select modal-date-mt" />
      </div>
      <button class="logout-btn modal-close" onclick="closeCashModal()">
        ✕
      </button>
    </div>
    <div class="modal-body">
      <div class="table-wrap">
        <table class="calc-table" id="cash-calc-table"></table>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn-primary" onclick="submitCashModal()">
        Сохранить сбор
      </button>
    </div>
  </div>
</div>

<div id="exp-modal" class="modal-overlay hidden no-print">
  <div class="modal-window">
    <div class="modal-head">
      <div class="modal-title">Расход из кассы (4500 грн)</div>
      <button class="logout-btn modal-close" onclick="closeExpModal()">
        ✕
      </button>
    </div>
    <div class="modal-body modal-body-scroll">
      <input type="date" id="exp-date" class="field" />
      <select id="exp-type" class="field">
        <option value="Терминал (чек)">
          Выдача наличных по терминалу (чеки)
        </option>
        <option value="Материалы">Другие траты (чек/отчет)</option>
      </select>
      <input
        type="number"
        id="exp-amount"
        class="field"
        placeholder="Сумма расхода, грн"
      />
      <input
        type="text"
        id="exp-note"
        class="field"
        placeholder="Номер чека или что купили"
      />
    </div>
    <div class="modal-foot">
      <button class="btn-primary" onclick="submitExpModal()">
        Записать расход
      </button>
    </div>
  </div>
</div>

<div id="tpl-modal" class="modal-overlay hidden no-print">
  <div class="modal-window modal-compact">
    <div class="modal-head">
      <div class="modal-title">📅 Шаблон расписания (Пн–Вс)</div>
      <button class="logout-btn modal-close" onclick="closeTemplateModal()">
        ✕
      </button>
    </div>
    <div class="modal-body modal-body-scroll">
      <div class="modal-hint">
        Изменения применятся к новым будущим неделям (текущая неделя не
        изменится).
      </div>
      <div id="tpl-rows-box"></div>
    </div>
    <div class="modal-foot">
      <button class="btn-primary" onclick="saveTemplate()">
        💾 Сохранить шаблон
      </button>
    </div>
  </div>
</div>
