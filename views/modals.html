<div id="cash-modal" class="modal-overlay hidden no-print">
  <div class="modal-window">
    <div class="modal-head">
      <div>
        <div style="font-weight: 800; font-size: 17px">
          Сбор выручки с боксов
        </div>
        <input
          type="date"
          id="cash-date"
          class="mini-select"
          style="margin-top: 4px"
        />
      </div>
      <button
        class="logout-btn"
        style="font-size: 22px; padding: 4px 8px"
        onclick="closeCashModal()"
      >
        ✕
      </button>
    </div>
    <div class="modal-body">
      <div class="table-wrap">
        <table class="calc-table" id="cash-calc-table"></table>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn-primary" onclick="submitCashModal()">
        Сохранить сбор
      </button>
    </div>
  </div>
</div>

<div id="exp-modal" class="modal-overlay hidden no-print">
  <div class="modal-window">
    <div class="modal-head">
      <div style="font-weight: 800; font-size: 17px">
        Расход из кассы (4500 грн)
      </div>
      <button
        class="logout-btn"
        style="font-size: 22px; padding: 4px 8px"
        onclick="closeExpModal()"
      >
        ✕
      </button>
    </div>
    <div class="modal-body" style="padding: 14px">
      <input type="date" id="exp-date" class="field" />
      <select id="exp-type" class="field">
        <option value="Терминал (чек)">
          Выдача наличных по терминалу (чеки)
        </option>
        <option value="Материалы">Другие траты (чек/отчет)</option>
      </select>
      <input
        type="number"
        id="exp-amount"
        class="field"
        placeholder="Сумма расхода, грн"
      />
      <input
        type="text"
        id="exp-note"
        class="field"
        placeholder="Номер чека или что купили"
      />
    </div>
    <div class="modal-foot">
      <button class="btn-primary" onclick="submitExpModal()">
        Записать расход
      </button>
    </div>
  </div>
</div>
