<div id="tab-schedule" class="tab-view">
  <div id="sched-main-view" style="grid-column: 1 / -1">
    <div
      id="schedule-list"
      style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px"
    ></div>
    <button
      class="btn-outline no-print"
      style="margin-top: 12px; width: 100%; max-width: 100%"
      onclick="toggleSchedSub('weeks')"
    >
      📊 Отчёт по отработанным неделям
    </button>
  </div>

  <div id="sched-weeks-view" class="hidden" style="grid-column: 1 / -1">
    <div class="rep-toolbar no-print">
      <button class="btn-back" onclick="toggleSchedSub('main')">
        ← Назад к графику
      </button>
      <button class="btn-print" onclick="window.print()">🖨️ Печать</button>
    </div>
    <div class="panel print-area">
      <div
        style="
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-bottom: 10px;
        "
      >
        <h3 style="margin: 0">Отработанные недели</h3>
        <select
          id="sched-week-filter"
          class="mini-select no-print"
          onchange="renderWeeklyScheduleReport()"
        ></select>
      </div>
      <div id="sched-weeks-box"></div>
    </div>
  </div>
</div>
