<div id="tab-notes" class="tab-view hidden">
  <!-- ЭКРАН 1: ДОБАВЛЕНИЕ И ПОСЛЕДНИЕ АКТУАЛЬНЫЕ ЗАМЕТКИ -->
  <div id="notes-main-view">
    <div class="panel" id="note-add-panel">
      <h3>Новая заметка</h3>
      <div style="display: flex; gap: 8px; margin-bottom: 10px">
        <input
          type="date"
          id="note-date"
          class="field"
          style="margin-bottom: 0; flex: 1"
        />
        <select
          id="note-target"
          class="field"
          style="margin-bottom: 0; flex: 1"
        >
          <option value="Общее">Общее (мойка)</option>
          <option value="Бокс 1">Бокс 1</option>
          <option value="Бокс 2">Бокс 2</option>
          <option value="Бокс 3">Бокс 3</option>
          <option value="Бокс 4">Бокс 4</option>
          <option value="Бокс 5">Бокс 5</option>
          <option value="Пилосос">Пилосос</option>
          <option value="Терминал / Касса">Терминал / Касса</option>
        </select>
      </div>
      <select id="note-type" class="field">
        <option value="issue" selected>
          ⚠️ Требует внимания (поломка / задача)
        </option>
        <option value="info">ℹ️ Инфо / проделанная работа</option>
      </select>
      <input
        type="text"
        id="note-text"
        class="field"
        placeholder="Опишите ситуацию или выполненную работу..."
      />
      <button class="btn-primary" id="btn-add-note" onclick="addNote()">
        Записать в журнал
      </button>
    </div>

    <div class="panel">
      <div
        style="
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-bottom: 8px;
        "
      >
        <h3 style="margin: 0">Свежие события</h3>
        <span
          style="font-size: 12px; color: #64748b"
          id="notes-active-count"
        ></span>
      </div>
      <div style="font-size: 12px; color: #64748b; margin-bottom: 8px">
        Показаны нерешённые проблемы и последние записи
      </div>
      <div id="notes-recent-list"></div>
    </div>

    <div class="panel no-print">
      <button
        class="btn-outline"
        style="width: 100%; max-width: 100%"
        onclick="toggleNotesSub('archive')"
      >
        🗂️ Архив всех заметок (фильтры и дата)
      </button>
    </div>
  </div>

  <!-- ЭКРАН 2: ПОЛНЫЙ АРХИВ ЗАМЕТОК С ФИЛЬТРАМИ ПО ТИПУ, ОБЪЕКТУ И ДАТЕ -->
  <div id="notes-archive-view" class="hidden">
    <div class="rep-toolbar no-print">
      <button class="btn-back" onclick="toggleNotesSub('main')">← Назад</button>
      <button class="btn-print" onclick="window.print()">🖨️ Печать</button>
    </div>

    <div class="panel print-area">
      <h3>Архив заметок по мойке</h3>
      <div
        class="no-print"
        style="
          display: flex;
          flex-direction: column;
          gap: 8px;
          margin-bottom: 12px;
        "
      >
        <div style="display: flex; gap: 8px">
          <select
            id="arch-status"
            class="mini-select"
            style="flex: 1"
            onchange="renderNotesArchive()"
          >
            <option value="all" selected>Все типы</option>
            <option value="active">⚠️ Требуют внимания</option>
            <option value="info">ℹ️ Инфо / работы</option>
            <option value="done">✅ Решённые</option>
          </select>
          <select
            id="arch-target"
            class="mini-select"
            style="flex: 1"
            onchange="renderNotesArchive()"
          >
            <option value="all" selected>Все посты</option>
            <option value="Общее">Общее (мойка)</option>
            <option value="Бокс 1">Бокс 1</option>
            <option value="Бокс 2">Бокс 2</option>
            <option value="Бокс 3">Бокс 3</option>
            <option value="Бокс 4">Бокс 4</option>
            <option value="Бокс 5">Бокс 5</option>
            <option value="Пилосос">Пилосос</option>
            <option value="Терминал / Касса">Терминал / Касса</option>
          </select>
        </div>
        <div style="display: flex; gap: 8px; align-items: center">
          <input
            type="date"
            id="arch-date"
            class="mini-select"
            style="flex: 1"
            onchange="renderNotesArchive()"
          />
          <button
            class="logout-btn"
            style="color: #2563eb; font-size: 13px; padding: 6px 10px"
            onclick="resetNotesArchiveFilters()"
          >
            Сбросить дату
          </button>
        </div>
      </div>
      <div id="notes-archive-list"></div>
    </div>
  </div>
</div>
