<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Смены и Касса</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="style.css" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="icon.png" />
  </head>
  <body>
    <div id="loader">Синхронизация...</div>

    <div class="container">
      <div class="topbar">
        <div class="app-title" id="page-title">График выходов</div>
        <div class="user-pill">
          <span id="user-info">...</span>
          <button
            class="logout-btn btn-pass"
            onclick="changePassword()"
            title="Сменить пароль"
          >
            🔑
          </button>
          <button class="logout-btn" onclick="logout()" title="Выйти">✕</button>
        </div>
      </div>

      <div id="slot-schedule"></div>

      <div id="tab-finance" class="tab-view hidden">
        <div class="seg-bar no-print" id="fin-switcher">
          <button
            class="seg-btn active"
            id="seg-cash"
            onclick="switchFinMode('cash')"
          >
            💵 Касса и боксы
          </button>
          <button
            class="seg-btn"
            id="seg-salary"
            onclick="switchFinMode('salary')"
          >
            💳 З/П
          </button>
        </div>
        <div id="slot-cash"></div>
        <div id="slot-salary"></div>
      </div>

      <div id="slot-admin"></div>
      <div id="slot-notes"></div>
    </div>

    <div id="slot-modals"></div>

    <nav class="bottom-nav">
      <button
        class="nav-item active"
        onclick="switchTab('schedule', 'График выходов', this)"
      >
        <span class="nav-ico">📅</span><span>График</span>
      </button>
      <button
        class="nav-item"
        id="nav-finance"
        onclick="switchTab('finance', 'Финансы и касса', this)"
      >
        <span class="nav-ico">💳</span><span>Финансы</span>
      </button>
      <button
        class="nav-item"
        onclick="switchTab('notes', 'Заметки по мойке', this)"
      >
        <span class="nav-ico">🔧</span><span>Заметки</span>
      </button>

      <button
        class="nav-item hidden"
        id="nav-logs"
        onclick="switchTab('logs', 'Журнал правок', this)"
      >
        <span class="nav-ico">🛡️</span><span>Журнал</span>
      </button>
      <button
        class="nav-item hidden"
        id="nav-perms"
        onclick="switchTab('perms', 'Права доступа', this)"
      >
        <span class="nav-ico">⚙️</span><span>Права</span>
      </button>
    </nav>

    <script src="config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/schedule.js"></script>
    <script src="js/cash.js"></script>
    <script src="js/salary.js"></script>
    <script src="js/notes.js"></script>
    <script src="js/main.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("./sw.js");
      }
    </script>
  </body>
</html>
