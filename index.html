<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Смены и Касса</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="style.css" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link rel="apple-touch-icon" href="icon.png" />
  </head>
  <body>
    <div id="loader">Синхронизация...</div>
    <div class="container">
      <div class="topbar">
        <div class="app-title" id="page-title">График выходов</div>
        <div class="user-pill">
          <span id="user-info">...</span>
          <button
            class="logout-btn"
            style="color: #2563eb"
            onclick="changePassword()"
            title="Сменить пароль"
          >
            🔑
          </button>
          <button class="logout-btn" onclick="logout()" title="Выйти">✕</button>
        </div>
      </div>

      <div id="tab-schedule" class="tab-view"></div>

      <div id="tab-finance" class="tab-view hidden">
        <div class="seg-bar no-print" id="fin-switcher">
          <button
            class="seg-btn active"
            id="seg-cash"
            onclick="switchFinMode('cash')"
          >
            💵 Касса
          </button>
          <button
            class="seg-btn"
            id="seg-salary"
            onclick="switchFinMode('salary')"
          >
            💳 ЗП и долги
          </button>
        </div>

        <!-- БЛОК КАССЫ -->
        <div id="mode-cash">
          <div class="panel no-print hidden" id="cash-add-box">
            <button class="btn-primary" onclick="openCashModal()">
              ➕ Внести инкассацию (таблица)
            </button>
          </div>

          <div class="panel">
            <div
              style="
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 10px;
              "
            >
              <h3 style="margin: 0">Сводка кассы</h3>
              <select
                id="cash-period"
                class="mini-select no-print"
                onchange="renderCashStats()"
              >
                <option value="today">За сегодня</option>
                <option value="week">За неделю</option>
                <option value="month" selected>За месяц</option>
                <option value="all">За всё время</option>
              </select>
            </div>
            <div id="cash-boxes-summary"></div>
          </div>

          <div class="panel">
            <div
              style="
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 10px;
              "
            >
              <h3 style="margin: 0">Контроль купюр</h3>
              <button
                class="btn-print no-print"
                style="padding: 6px 12px; font-size: 13px"
                onclick="window.print()"
              >
                🖨️ Печать
              </button>
            </div>
            <div id="cash-denoms-summary"></div>
          </div>
        </div>

        <!-- БЛОК ЗАРПЛАТЫ И ДОЛГОВ -->
        <div id="mode-salary" class="hidden">
          <div id="fin-main">
            <div class="panel">
              <h3>Текущий долг по зарплате</h3>
              <div id="balance-list"></div>
            </div>
            <div class="panel hidden" id="payment-card">
              <h3>Выплата из кассы</h3>
              <select id="pay-emp" class="field"></select>
              <input type="date" id="pay-date" class="field" />
              <input
                type="number"
                id="pay-amount"
                class="field"
                placeholder="Сумма выплаты"
              />
              <button class="btn-primary" onclick="addPayment()">
                Записать выплату
              </button>
            </div>
            <div class="panel">
              <h3>Отчеты по зарплате</h3>
              <div class="rep-grid">
                <button class="btn-outline" onclick="showFinSub('weekly')">
                  📊 За неделю
                </button>
                <button class="btn-outline" onclick="showFinSub('monthly')">
                  📆 За месяц
                </button>
              </div>
            </div>
          </div>

          <div id="fin-weekly" class="hidden">
            <div class="rep-toolbar no-print">
              <button class="btn-back" onclick="showFinSub('main')">
                ← Назад
              </button>
              <button class="btn-print" onclick="window.print()">
                🖨️ Печать
              </button>
            </div>
            <div class="panel print-area">
              <h3>Отчет по закрытым неделям</h3>
              <div id="summary-list"></div>
            </div>
          </div>

          <div id="fin-monthly" class="hidden">
            <div class="rep-toolbar no-print">
              <button class="btn-back" onclick="showFinSub('main')">
                ← Назад
              </button>
              <button class="btn-print" onclick="window.print()">
                🖨️ Печать
              </button>
            </div>
            <div class="panel print-area">
              <h3>Отчет по закрытым месяцам</h3>
              <div id="monthly-list"></div>
            </div>
          </div>
        </div>
      </div>

      <div id="tab-logs" class="tab-view hidden">
        <div class="panel">
          <h3>История изменений</h3>
          <div id="logs-list"></div>
        </div>
      </div>

      <div id="tab-perms" class="tab-view hidden">
        <div class="panel">
          <h3>Настройка прав ролей</h3>
          <div id="perms-box"></div>
          <button
            class="btn-primary"
            style="margin-top: 12px; background: #2563eb"
            onclick="savePerms()"
          >
            Сохранить права
          </button>
        </div>
      </div>
    </div>

    <!-- ОТДЕЛЬНОЕ ОКНО ВВОДА ИНКАССАЦИИ (ТАБЛИЦА) -->
    <div id="cash-modal" class="modal-overlay hidden">
      <div class="modal-window">
        <div class="modal-head">
          <div>
            <div style="font-weight: 800; font-size: 17px">
              Сбор кассы по боксам
            </div>
            <input
              type="date"
              id="cash-date"
              class="mini-select"
              style="margin-top: 4px"
            />
          </div>
          <button
            class="logout-btn"
            style="font-size: 22px; padding: 4px 8px"
            onclick="closeCashModal()"
          >
            ✕
          </button>
        </div>
        <div class="modal-body">
          <div class="table-wrap">
            <table class="calc-table" id="cash-calc-table"></table>
          </div>
        </div>
        <div class="modal-foot">
          <button class="btn-primary" onclick="submitCashModal()">
            Сохранить инкассацию
          </button>
        </div>
      </div>
    </div>

    <nav class="bottom-nav">
      <button
        class="nav-item active"
        onclick="switchTab('schedule', 'График выходов', this)"
      >
        <span class="nav-ico">📅</span><span>График</span>
      </button>
      <button
        class="nav-item"
        id="nav-finance"
        onclick="switchTab('finance', 'Финансы и касса', this)"
      >
        <span class="nav-ico">💳</span><span>Финансы</span>
      </button>
      <button
        class="nav-item hidden"
        id="nav-logs"
        onclick="switchTab('logs', 'Журнал правок', this)"
      >
        <span class="nav-ico">🛡️</span><span>Журнал</span>
      </button>
      <button
        class="nav-item hidden"
        id="nav-perms"
        onclick="switchTab('perms', 'Права доступа', this)"
      >
        <span class="nav-ico">⚙️</span><span>Права</span>
      </button>
    </nav>

    <script src="config.js"></script>
    <script src="app.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("./sw.js");
      }
    </script>
  </body>
</html>
