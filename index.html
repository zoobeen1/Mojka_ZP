<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Смены и Зарплата</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="style.css" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link rel="apple-touch-icon" href="icon.png" />
  </head>
  <body>
    <div id="loader">Синхронизация...</div>
    <div class="container">
      <div class="topbar">
        <div class="app-title" id="page-title">График выходов</div>
        <div class="user-pill">
          <span id="user-info">...</span>
          <button
            class="logout-btn"
            style="color: #2563eb"
            onclick="changePassword()"
            title="Сменить пароль"
          >
            🔑
          </button>
          <button class="logout-btn" onclick="logout()" title="Выйти">✕</button>
        </div>
      </div>

      <div id="tab-schedule" class="tab-view"></div>

      <div id="tab-finance" class="tab-view hidden">
        <div id="fin-main">
          <div class="panel">
            <h3>Текущий долг по зарплате</h3>
            <div id="balance-list"></div>
          </div>
          <div class="panel hidden" id="payment-card">
            <h3>Выплата из кассы</h3>
            <select id="pay-emp" class="field"></select>
            <input type="date" id="pay-date" class="field" />
            <input
              type="number"
              id="pay-amount"
              class="field"
              placeholder="Сумма выплаты"
            />
            <button class="btn-primary" onclick="addPayment()">
              Записать выплату
            </button>
          </div>
          <div class="panel">
            <h3>Отчеты и архив</h3>
            <div class="rep-grid">
              <button class="btn-outline" onclick="showFinSub('weekly')">
                📊 За неделю
              </button>
              <button class="btn-outline" onclick="showFinSub('monthly')">
                📆 За месяц
              </button>
            </div>
          </div>
        </div>

        <div id="fin-weekly" class="hidden">
          <div class="rep-toolbar no-print">
            <button class="btn-back" onclick="showFinSub('main')">
              ← Назад
            </button>
            <button class="btn-print" onclick="window.print()">
              🖨️ Печать
            </button>
          </div>
          <div class="panel print-area">
            <h3>Отчет по закрытым неделям</h3>
            <div id="summary-list"></div>
          </div>
        </div>

        <div id="fin-monthly" class="hidden">
          <div class="rep-toolbar no-print">
            <button class="btn-back" onclick="showFinSub('main')">
              ← Назад
            </button>
            <button class="btn-print" onclick="window.print()">
              🖨️ Печать
            </button>
          </div>
          <div class="panel print-area">
            <h3>Отчет по закрытым месяцам</h3>
            <div id="monthly-list"></div>
          </div>
        </div>
      </div>

      <div id="tab-logs" class="tab-view hidden">
        <div class="panel">
          <h3>История изменений</h3>
          <div id="logs-list"></div>
        </div>
      </div>

      <div id="tab-perms" class="tab-view hidden">
        <div class="panel">
          <h3>Настройка прав ролей</h3>
          <div id="perms-box"></div>
          <button
            class="btn-primary"
            style="margin-top: 12px; background: #2563eb"
            onclick="savePerms()"
          >
            Сохранить права
          </button>
        </div>
      </div>
    </div>

    <nav class="bottom-nav">
      <button
        class="nav-item active"
        onclick="switchTab('schedule', 'График выходов', this)"
      >
        <span class="nav-ico">📅</span><span>График</span>
      </button>
      <button
        class="nav-item"
        id="nav-finance"
        onclick="switchTab('finance', 'Зарплата и долги', this)"
      >
        <span class="nav-ico">💳</span><span>Финансы</span>
      </button>
      <button
        class="nav-item hidden"
        id="nav-logs"
        onclick="switchTab('logs', 'Журнал правок', this)"
      >
        <span class="nav-ico">🛡️</span><span>Журнал</span>
      </button>
      <button
        class="nav-item hidden"
        id="nav-perms"
        onclick="switchTab('perms', 'Права доступа', this)"
      >
        <span class="nav-ico">⚙️</span><span>Права</span>
      </button>
    </nav>

    <script src="config.js"></script>
    <script src="app.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("./sw.js");
      }
    </script>
  </body>
</html>
